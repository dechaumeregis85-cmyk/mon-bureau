<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Bureau</title>
<style>
:root{--ink:#23332f;--green:#17664f;--muted:#5b6b65;--line:#d8e0da;--bg:#f4f5ef;--warn:#8c3917;--warnbg:#fce5d9;--wait:#795512;--waitbg:#f7edcf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 'Segoe UI',Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;min-height:48px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:9px 15px}
button:hover{background:#e7efe8}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd7622;outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:25px;margin:0}
main{max-width:900px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
label{font-weight:600;display:block;margin-bottom:6px}
input,select{min-height:50px;border:1px solid #99aaa1;border-radius:6px;padding:9px 12px;background:#fff;color:var(--ink);width:100%;max-width:100%}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:12px 0 0}
.chk input{width:26px;min-height:26px}
.task{padding:16px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task strong{font-size:20px;display:block;margin-top:6px}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:4px 9px;border-radius:5px;background:#edf1eb}
.urgent{background:var(--warnbg);color:var(--warn)}
.wait{background:var(--waitbg);color:var(--wait)}
.sub{font-size:16px;color:var(--muted)}
.tabs button[aria-pressed=true]{background:#dcebe1;border-color:var(--green)}
.actions button{font-size:16px}
.state{font-size:15px;color:var(--muted)}
.msg{padding:12px;border-radius:7px;margin:12px 0;white-space:pre-wrap}
.err{background:var(--warnbg);color:var(--warn)}
.okmsg{background:#e4efe6}
.hide{display:none!important}
dialog{border:1px solid var(--line);border-radius:12px;width:min(520px,94vw);padding:22px;color:var(--ink)}
dialog::backdrop{background:#142b2470}
footer{font-size:14px;color:var(--muted);text-align:center;padding:8px 0 26px}
@media(max-width:700px){header{padding:12px 14px}main{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Mon Bureau</h1>
  <div class="row"><span id="who" class="sub"></span><button id="login" class="primary">Se connecter</button><button id="logout" class="hide">Se déconnecter</button></div>
</header>
<main>
  <div id="err" class="msg err hide"></div>
  <div id="ok" class="msg okmsg hide"></div>

  <section id="intro" class="card">
    <p><strong>Version de test.</strong> Cette page lit et écrit tes tâches dans le dossier de l’application, sur ton OneDrive. Rien n’est envoyé ailleurs.</p>
    <p id="sync" class="state">Non connecté.</p>
  </section>

  <section id="app" class="hide">
    <form class="card" id="addform" autocomplete="off">
      <label for="quick">Nouvelle action</label>
      <input id="quick" placeholder="Quelques mots sur ce qu’il faut faire" maxlength="180" required>
      <div class="grid" style="margin-top:12px">
        <div><label for="client">Dossier (client)</label><input id="client" placeholder="Nom du client" maxlength="60"></div>
        <div><label for="due">Date proposée</label><input id="due" type="date" required></div>
      </div>
      <label class="chk"><input id="blocking" type="checkbox"> Cette action débloque le dossier</label>
      <div style="margin-top:14px"><button class="primary" type="submit">Ajouter une tâche</button></div>
    </form>

    <div class="row tabs card" id="tabs" style="gap:8px"></div>
    <div class="card" id="list"></div>
    <p class="state" id="updated"></p>
  </section>
</main>
<footer>Mon Bureau — interface hébergée, données sur OneDrive</footer>

<dialog id="dlg"><div id="dlgbody"></div></dialog>

<script>
"use strict";
var TENANT="6fac8455-58fe-40e2-82ed-90b36e0a24e0";
var CLIENT="8b242272-433b-4acc-8f42-82567c8b9b87";
var SCOPES="openid profile offline_access https://graph.microsoft.com/User.Read https://graph.microsoft.com/Files.ReadWrite.AppFolder";
var AUTH="https://login.microsoftonline.com/"+TENANT+"/oauth2/v2.0";
var GRAPH="https://graph.microsoft.com/v1.0";
var FILEPATH="/me/drive/special/approot:/mon-bureau/data.json";
var LS_REFRESH="monbureau.refresh",LS_DATA="monbureau.cache",SS="monbureau.pkce";
var $=function(s){return document.querySelector(s)};
var data={version:1,tasks:[]},filter="todo",token=null,tokenExp=0;

function fail(m){var e=$("#err");e.textContent=m;e.classList.remove("hide");$("#ok").classList.add("hide");}
function clearMsgs(){$("#err").classList.add("hide");$("#ok").classList.add("hide");}
function ok(m){var e=$("#ok");e.textContent=m;e.classList.remove("hide");$("#err").classList.add("hide");}
function b64url(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function randomString(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a);}
function challenge(v){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)).then(b64url);}
function redirectUri(){return location.origin+location.pathname;}
function today(){return new Date().toISOString().slice(0,10);}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function frDate(s){if(!s)return"";var d=new Date(s+"T12:00:00");var t=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});return (s<=today()?"à faire — ":"prévu ")+t;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

function login(){
  clearMsgs();
  var v=randomString(32),st=randomString(16);
  sessionStorage.setItem(SS,JSON.stringify({verifier:v,state:st}));
  challenge(v).then(function(c){
    var p=new URLSearchParams({client_id:CLIENT,response_type:"code",redirect_uri:redirectUri(),response_mode:"fragment",scope:SCOPES,state:st,code_challenge:c,code_challenge_method:"S256"});
    location.assign(AUTH+"/authorize?"+p.toString());
  }).catch(function(e){fail("Impossible de démarrer la connexion : "+e.message);});
}
function tokenRequest(body){
  return fetch(AUTH+"/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body).toString()})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error((j.error||"erreur")+" : "+(j.error_description||"échec de la requête de jeton"));return j;});});
}
function storeTokens(j){
  token=j.access_token;tokenExp=Date.now()+((j.expires_in||3600)*1000)-60000;
  if(j.refresh_token)localStorage.setItem(LS_REFRESH,j.refresh_token);
}
function refresh(){
  var rt=localStorage.getItem(LS_REFRESH);
  if(!rt)return Promise.resolve(false);
  return tokenRequest({grant_type:"refresh_token",client_id:CLIENT,refresh_token:rt,scope:SCOPES,redirect_uri:redirectUri()})
    .then(function(j){storeTokens(j);return true;})
    .catch(function(){localStorage.removeItem(LS_REFRESH);return false;});
}
function api(path,opt,retried){
  opt=opt||{};
  var ready=(token&&Date.now()<tokenExp)?Promise.resolve(true):refresh();
  return ready.then(function(got){
    if(!got){showLoggedOut();throw new Error("Session expirée, reconnecte-toi.");}
    var headers=Object.assign({"Authorization":"Bearer "+token},opt.headers||{});
    return fetch(GRAPH+path,{method:opt.method||"GET",headers:headers,body:opt.body});
  }).then(function(r){
    if(r.status===401&&!retried){return refresh().then(function(g){if(g)return api(path,opt,true);throw new Error("Session expirée, reconnecte-toi.");});}
    if(!r.ok)return r.text().then(function(t){var e=new Error("Erreur OneDrive ("+r.status+") : "+t.slice(0,300));e.status=r.status;throw e;});
    return r.text().then(function(t){return t?JSON.parse(t):{};});
  });
}
function loadData(){
  return api(FILEPATH+":/content").then(function(j){
    if(j&&Array.isArray(j.tasks)){data=j;localStorage.setItem(LS_DATA,JSON.stringify(j));}
    render();
  }).catch(function(e){
    if(e.status===404||/itemNotFound/.test(e.message)){data={version:1,tasks:[]};return saveData();}
    throw e;
  });
}
function saveData(){
  return api(FILEPATH+":/content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(){
    localStorage.setItem(LS_DATA,JSON.stringify(data));
    $("#updated").textContent="Enregistré sur OneDrive "+new Date().toLocaleString("fr-FR");
  });
}
function commit(){
  saveData().then(function(){render();ok("Action enregistrée sur OneDrive.");}).catch(function(e){fail(String(e.message));});
}
function askDate(title,dlabel,value,cb){
  $("#dlgbody").innerHTML='<h2 style="margin:0 0 12px;font-size:21px">'+esc(title)+'</h2><label for="dlgd">'+esc(dlabel)+'</label><input id="dlgd" type="date" value="'+esc(value)+'"><div class="row" style="margin-top:16px"><button class="primary" id="dlgok" type="button">Valider</button><button id="dlgno" type="button">Annuler</button></div>';
  var d=$("#dlg");d.showModal();
  $("#dlgok").onclick=function(){var v=$("#dlgd").value;d.close();if(v)cb(v);};
  $("#dlgno").onclick=function(){d.close();};
}
function render(){
  var counts={todo:0,waiting:0,done:0};
  data.tasks.forEach(function(t){counts[t.status]=(counts[t.status]||0)+1;});
  $("#tabs").innerHTML=[["todo","À faire"],["waiting","En attente"],["done","Terminées"]].map(function(p){
    return '<button type="button" aria-pressed="'+(filter===p[0])+'" data-f="'+p[0]+'">'+p[1]+" ("+(counts[p[0]]||0)+")</button>";
  }).join("");
  Array.prototype.forEach.call($("#tabs").querySelectorAll("button"),function(b){b.onclick=function(){filter=b.dataset.f;render();};});
  var rows=data.tasks.filter(function(t){return t.status===filter;}).sort(function(a,b){
    return (Number(b.block)-Number(a.block))||String(a.date).localeCompare(String(b.date));
  });
  $("#list").innerHTML=rows.length?rows.map(function(t){
    var late=t.status==="todo"&&t.date<today();
    var tag=t.block?'<span class="tag urgent">Débloque le dossier</span>':(late?'<span class="tag urgent">En retard</span>':(t.status==="waiting"?'<span class="tag wait">Réponse attendue</span>':'<span class="tag">À traiter</span>'));
    var btns=t.status==="done"
      ? '<button type="button" data-a="todo">Remettre à faire</button>'
      : '<button type="button" class="primary" data-a="done">Terminer</button><button type="button" data-a="report">Reporter</button>'+(t.status==="todo"?'<button type="button" data-a="waiting">Demande envoyée</button>':'');
    return '<article class="task" data-id="'+t.id+'"><div class="row between">'+tag+'<span class="sub">'+(t.status==="waiting"?"Relance : ":"")+frDate(t.date)+'</span></div><strong>'+esc(t.text)+'</strong><div class="sub">Dossier '+esc(t.client||"—")+'</div><div class="row actions" style="margin-top:10px">'+btns+"</div></article>";
  }).join(""):'<p class="sub">Aucune action dans cette liste.</p>';
  Array.prototype.forEach.call($("#list").querySelectorAll("article"),function(a){
    var id=a.dataset.id;
    Array.prototype.forEach.call(a.querySelectorAll("button"),function(b){
      b.onclick=function(){
        var t=data.tasks.filter(function(x){return String(x.id)===String(id);})[0];
        if(!t)return;
        var act=b.dataset.a;
        if(act==="report"){askDate("Reporter l’action","Nouvelle échéance",t.date||addDays(1),function(v){t.date=v;commit();});return;}
        if(act==="waiting"){askDate("Demande envoyée","Date de relance",t.date||addDays(5),function(v){t.date=v;t.status="waiting";commit();});return;}
        t.status=act;commit();
      };
    });
  });
}
$("#addform").onsubmit=function(e){
  e.preventDefault();clearMsgs();
  var text=$("#quick").value.trim();
  if(!text){fail("Écris quelques mots pour décrire l’action.");return;}
  var due=$("#due").value;
  if(!due){fail("Choisis une date proposée.");return;}
  data.tasks.unshift({id:Date.now(),client:($("#client").value.trim()||"—"),text:text,date:due,status:"todo",block:$("#blocking").checked,created:new Date().toISOString()});
  $("#quick").value="";$("#client").value="";$("#blocking").checked=false;$("#due").value=addDays(1);
  filter="todo";
  commit();
};
function showLoggedOut(){
  $("#login").classList.remove("hide");$("#logout").classList.add("hide");$("#app").classList.add("hide");
  $("#who").textContent="";$("#sync").textContent="Non connecté.";
}
function showLoggedIn(){
  $("#login").classList.add("hide");$("#logout").classList.remove("hide");$("#app").classList.remove("hide");
}
function start(){
  var h=new URLSearchParams(location.hash.replace(/^#/,""));
  var chain=Promise.resolve();
  if(h.get("error")){fail("Connexion refusée : "+h.get("error")+" — "+(h.get("error_description")||""));history.replaceState(null,"",redirectUri());}
  else if(h.get("code")){
    var saved={};try{saved=JSON.parse(sessionStorage.getItem(SS)||"{}");}catch(e){}
    sessionStorage.removeItem(SS);
    chain=tokenRequest({grant_type:"authorization_code",client_id:CLIENT,code:h.get("code"),redirect_uri:redirectUri(),scope:SCOPES,code_verifier:saved.verifier})
      .then(function(j){storeTokens(j);history.replaceState(null,"",redirectUri());})
      .catch(function(e){fail("Échec de la connexion : "+e.message);history.replaceState(null,"",redirectUri());});
  }
  chain.then(function(){
    var cached=null;try{cached=JSON.parse(localStorage.getItem(LS_DATA)||"null");}catch(e){}
    return refresh().then(function(has){
      if(!token&&!has)return;
      showLoggedIn();
      $("#sync").textContent="Connecté. Lecture de tes tâches sur OneDrive…";
      if(cached&&Array.isArray(cached.tasks)){data=cached;render();}
      return api("/me?$select=displayName").then(function(me){$("#who").textContent=me.displayName||"";})
        .then(loadData)
        .then(function(){$("#sync").textContent="Connecté — tes tâches sont lues et enregistrées dans ton OneDrive.";})
        .catch(function(e){fail(String(e.message));$("#sync").textContent="Connecté, mais lecture impossible.";});
    });
  });
}
$("#login").onclick=login;
$("#logout").onclick=function(){localStorage.removeItem(LS_REFRESH);localStorage.removeItem(LS_DATA);token=null;showLoggedOut();};
$("#due").value=addDays(1);
start();
</script>
</body>
</html>
